# ChatGPT: build only the TrollStore .tipa (iOS 14 - 16.6.1, 17.0)
# Run from Actions tab -> Build ChatGPT (TrollStore) -> Run workflow
# Result: artifact ChatGPT-TrollStore.tipa, install with TrollStore on iOS 17.0
name: Build ChatGPT (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-chatgpt.yml'
      - '.github/workflows/build.yml'
      - 'browser/**'
      - 'tools/release/**'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      build_normal_ipa: false
      build_trollstore_tipa: true
      build_jailbroken_ipa: false
